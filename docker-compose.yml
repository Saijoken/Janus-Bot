services:
  postgres:
    image: postgres:15-alpine
    container_name: discordbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-discordbot}
      POSTGRES_USER: ${DB_USER:-discordbot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-discordbot_password}
      # Optimisations pour démarrage rapide
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - discordbot-network
    # Healthcheck optimisé pour détection rapide
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-discordbot_user} -d ${DB_NAME:-discordbot}"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    # Optimisations supplémentaires pour démarrage rapide
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=80MB
      -c max_wal_size=1GB
  yt-cipher:
    build:
      context: ./yt-cipher-src
      dockerfile: Dockerfile
    container_name: yt-cipher
    restart: unless-stopped
    # Fast shutdown (Deno doesn't handle SIGTERM well)
    stop_grace_period: 2s
    environment:
      # API token for authentication (optional but recommended)
      - API_TOKEN=${YT_CIPHER_TOKEN:-youshallnotpass}
      # Port (default 8001)
      - PORT=8001
      # Max worker threads
      - MAX_THREADS=2
      # Cache size for player scripts
      - PREPROCESSED_CACHE_SIZE=150
    networks:
      - discordbot-network
    expose:
      - 8001

  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    image: lavalink-custom:latest
    container_name: lavalink
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      yt-cipher:
        condition: service_started
    environment:
      # Java options optimized for FASTEST startup
      # -XX:TieredStopAtLevel=1: Only use C1 compiler (fastest startup, less optimization)
      # -XX:+UseParallelGC: Faster startup than G1GC
      # -XX:CICompilerCount=2: Use 2 compiler threads
      # -Xverify:none: Skip bytecode verification (faster but less safe)
      # -XX:-UsePerfData: Disable perf data collection
      - _JAVA_OPTIONS=-Xmx512M -Xms256M -XX:TieredStopAtLevel=1 -XX:+UseParallelGC -XX:CICompilerCount=2 -Xverify:none -XX:-UsePerfData
      # Set password for lavalink (can also be set in application.yml)
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      # Genius Access Token for lyrics
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN:-}
    volumes:
      # Mount application.yml from the same directory
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      # Persist plugins between restarts (make sure folder exists with correct permissions)
      - ./lavalink/plugins/:/opt/Lavalink/plugins/
    networks:
      - discordbot-network
    # Healthcheck to know when Lavalink is ready (requires authorization header)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Authorization: youshallnotpass' http://localhost:2333/version || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    expose:
      # Expose port 2333 to other containers in the network
      - 2333
    ports:
      # Expose to host (only needed if accessing from outside containers)
      - "2333:2333"

  # Lyrics scraper - Puppeteer-based Genius scraper to bypass Cloudflare
  lyrics-scraper:
    build:
      context: ./lyrics-scraper
      dockerfile: Dockerfile
    container_name: lyrics-scraper
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - discordbot-network
    environment:
      - PORT=3500
      - API_TOKEN=${LYRICS_SCRAPER_TOKEN:-lyrics-secret}
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN:-}
    expose:
      - 3500
    # Resource limits (Puppeteer can be memory-hungry)
    deploy:
      resources:
        limits:
          memory: 512M

  discordbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discordbot
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    # Le bot attendra que PostgreSQL et Lavalink soient prêts grâce aux healthchecks
    networks:
      - discordbot-network
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COUNTER_CHANNEL_ID=${COUNTER_CHANNEL_ID}
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-discordbot}
      - DB_USER=${DB_USER:-discordbot_user}
      - DB_PASSWORD=${DB_PASSWORD:-discordbot_password}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Lyrics scraper service
      - LYRICS_SCRAPER_HOST=lyrics-scraper
      - LYRICS_SCRAPER_PORT=3500
      - LYRICS_SCRAPER_TOKEN=${LYRICS_SCRAPER_TOKEN:-lyrics-secret}
      - MUSIC_DEFAULT_PLATFORM=${MUSIC_DEFAULT_PLATFORM:-scsearch}
    volumes:
      # Persist the economy.json database
      - ./economy.json:/app/economy.json
      # Optional: persist data in a data directory
      - bot-data:/app/data
    # Keep container running even if it crashes (restart policy handles this)
    stdin_open: true
    tty: true

volumes:
  bot-data:
  postgres-data:

networks:
  discordbot-network:
    driver: bridge
